<!doctype html>
<!--
  The homepage hero: a watercolour dusk coast that paints itself once, then holds.
  Embedded by docs/.vitepress/theme/HeroPainting.vue, which passes the bundled
  p5, p5.brush and Geist URLs in the query string. ?still=1 paints the finished
  picture in one frame (reduced motion, and the static poster hero.webp).
  The stroke engine follows the p5.brush watercolour sketch it was adapted from.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<link rel="icon" href="data:,">
<title>PaperSeek</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1c2a4a; }
  canvas { display: block; width: 100vw !important; height: 100vh !important; object-fit: cover; object-position: 50% 0; }
  @media (max-width: 639px) { canvas { object-position: 24% 0; } }
</style>
</head>
<body>
<script>
const query = new URLSearchParams(location.search);
const STILL = query.get('still') === '1' || matchMedia('(prefers-reduced-motion: reduce)').matches;
function loadScript(src) {
  return new Promise((resolve, reject) => {
    const el = document.createElement('script'); el.src = src; el.onload = resolve; el.onerror = reject;
    document.head.appendChild(el);
  });
}
const tell = (state) => {
  document.documentElement.dataset.hero = state;
  try { parent.postMessage({ source: 'paperseek-hero', state }, location.origin); } catch { /* standalone */ }
};

// ---- canvas and engine state --------------------------------------------
let W = 1200, H = 420, m = 420;
// The scene is drawn this far below its own coordinates: the frame shows more sky and the name sits at its
// vertical centre, while the sea falls below the visible part of the frame.
const SHIFT = Math.round(H * 0.15);
let brushScale = null;

const S = { water: 0.55, coverage: 0.84, density: 0.5, scale: 1.1, soft: 0.7, glaze: 0.3, touch: 0.25, detail: 0.5, brushSize: 1.4 };

const PALETTE = {
  seed: 1874,
  ground: '#3a4270',
  sky: ['#262f5c', '#4a4f86', '#8f7aa6'],
  glow: '#f2c3a6',
  sea: ['#46548a', '#2b3866', '#1f2a52'],
  foliage: ['#4a4f6a', '#3a3f55', '#2c3044', '#7a7f9a'],
  accents: ['#f0b39a', '#e8a48e', '#f6cdb5', '#f9dccb'],
  highlights: ['#f8e6d2', '#fdf5ee'],
  cliff: ['#d9a37f', '#e8c09a', '#c98d6f', '#f1d7b8'],
  grass: '#7d8a6e',
  stripe: '#b5524c',
  lamp: '#ffe2a6',
  teal: '#bfe6ea',
};

const rr = (a, b) => random(a, b);
const pickOne = (arr) => arr[Math.floor(random(arr.length))];
const clamp01 = (v) => Math.max(0, Math.min(1, v));
function hexRgb(h) { h = h.replace('#', ''); return [0, 2, 4].map((i) => parseInt(h.slice(i, i + 2), 16)); }
function mixHex(a, b, t) { const A = hexRgb(a), B = hexRgb(b); return '#' + A.map((v, i) => Math.round(v + (B[i] - v) * t).toString(16).padStart(2, '0')).join(''); }

function jitterEllipse(cx, cy, rx, ry, n, jitter, rot = 0) {
  const pts = [], a0 = rr(0, TWO_PI), cr = Math.cos(rot), sr = Math.sin(rot);
  for (let i = 0; i < n; i++) {
    const a = a0 + (i / n) * TWO_PI, k = 1 + rr(-jitter, jitter);
    const x = Math.cos(a) * rx * k, y = Math.sin(a) * ry * k;
    pts.push([cx + x * cr - y * sr, cy + x * sr + y * cr]);
  }
  return pts;
}
function bandPolygon(y0, y1, wobble, n = 12) {
  const top = [], bottom = [];
  for (let i = 0; i <= n; i++) { const x = -10 + (W + 20) * (i / n); top.push([x, y0 + rr(-wobble, wobble)]); bottom.push([x, y1 + rr(-wobble, wobble)]); }
  return top.concat(bottom.reverse());
}
const bboxOf = (pts, pad) => {
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  for (const [x, y] of pts) { if (x < x0) x0 = x; if (y < y0) y0 = y; if (x > x1) x1 = x; if (y > y1) y1 = y; }
  return [Math.max(0, Math.floor(x0 - pad)), Math.floor(y0 - pad), Math.min(W, Math.ceil(x1 + pad)), Math.ceil(y1 + pad)];
};

function fillStyle(color, opacity, bleed, texture, border) { brush.noStroke(); brush.noHatch(); brush.noWash(); brush.fill(color, opacity); brush.fillBleed(bleed, 'out'); brush.fillTexture(texture, border); }
function washStyle(color, opacity) { brush.noStroke(); brush.noHatch(); brush.noFill(); brush.wash(color, opacity); }
function strokeStyle(name, color, weight) { brush.noFill(); brush.noWash(); brush.noHatch(); brush.set(name, color, weight); }
const D = (fn, bb, axis, dir, dur, gap = 60) => ({ fn, bb, axis, dir, dur, gap });
const rdir = () => (random() < 0.5 ? 1 : -1);
const raxis = () => (random() < 0.5 ? 'x' : 'y');

function flushWash() {
  brush.noStroke(); brush.noHatch(); brush.noWash();
  brush.fill('#000000', 0); brush.fillBleed(0); brush.fillTexture(0, 0);
  brush.polygon([[-8, -8], [-6, -8], [-6, -6]]);
}
function ensureBrushes(scale) {
  if (brushScale !== null) return;
  brush.add('flick', { weight: 0.7, vibration: 0.12, definition: 0.9, quality: 0.8, opacity: 200, spacing: 0.1, pressure: { curve: [0.25, 0.25], min_max: [1.1, 0.85] } });
  brush.scaleBrushes(scale);
  brushScale = scale;
}

// ---- engine: paint holds finished strokes, buf the stroke being revealed --
function createEngine(cfg) {
  let buf, paint, strokes = [], idx = 0, startMs = null, done = false;

  function setup() {
    createCanvas(W, H, WEBGL);
    pixelDensity(Math.min(2, window.devicePixelRatio || 1));
    ensureBrushes(3 * m / 600);
    paint = createGraphics(W, H, WEBGL);
    buf = createGraphics(W, H, WEBGL);
    paint.imageMode(CORNER); buf.imageMode(CORNER);
    brush.load(buf);
    buf.push(); buf.translate(-W / 2, -H / 2);
    fillStyle('#7a86bd', 200, 0.3, 0.5, 0.3); brush.circle(W / 2, H / 2, 12);
    buf.pop(); buf.clear();
    imageMode(CORNER);
    background(cfg.palette.ground);
  }
  function load() {
    brush.load(buf);
    randomSeed(cfg.palette.seed); noiseSeed(cfg.palette.seed);
    strokes = cfg.strokes(cfg.palette);
    let cursor = 0;
    for (const s of strokes) { s.seed = Math.floor(random() * 1e9); s.begun = false; s.start = cursor; cursor += s.dur + s.gap; }
    const k = cfg.loopMs / cursor;
    for (const s of strokes) { s.start *= k; s.dur *= k; s.end = s.start + s.dur; }
    idx = 0;
    paint.background(cfg.palette.ground);
  }
  function beginStroke(s) {
    buf.clear();
    buf.push(); buf.translate(-W / 2, -H / 2);
    buf.image(paint, 0, 0, W, H);
    buf.translate(0, SHIFT);
    randomSeed(s.seed); noiseSeed(s.seed);
    s.fn(buf);
    flushWash();
    buf.pop();
    s.begun = true; s.p = 0;
  }
  function foldStroke() { paint.push(); paint.translate(-W / 2, -H / 2); paint.image(buf, 0, 0, W, H); paint.pop(); }
  function revealSlice(s) {
    const [x0, y0, x1, y1] = [s.bb[0], Math.max(0, s.bb[1] + SHIFT), s.bb[2], Math.min(H, s.bb[3] + SHIFT)];
    if (x1 <= x0 || y1 <= y0 || s.p <= 0) return;
    if (s.axis === 'x') {
      const w = Math.round((x1 - x0) * s.p); if (w <= 0) return;
      const a = s.dir > 0 ? x0 : x1 - w;
      image(buf, a, y0, w, y1 - y0, a, y0, w, y1 - y0);
    } else {
      const h = Math.round((y1 - y0) * s.p); if (h <= 0) return;
      const a = s.dir > 0 ? y0 : y1 - h;
      image(buf, x0, a, x1 - x0, h, x0, a, x1 - x0, h);
    }
  }
  function paintUpTo(t) {
    while (idx < strokes.length && strokes[idx].start <= t) {
      const s = strokes[idx];
      if (!s.begun) beginStroke(s);
      s.p = Math.min(1, (t - s.start) / s.dur);
      if (s.p >= 1) { foldStroke(); idx++; } else break;
    }
  }
  function drawFrame(t) {
    paintUpTo(t);
    image(paint, 0, 0, W, H);
    const s = strokes[idx];
    if (s && s.begun) revealSlice(s);
  }
  function draw() {
    if (done) return;
    if (!strokes.length) load();
    translate(-W / 2, -H / 2);
    if (STILL) { drawFrame(cfg.loopMs + 1); done = true; noLoop(); tell('done'); return; }
    if (startMs === null) { startMs = millis(); tell('painting'); }
    const elapsed = millis() - startMs;
    drawFrame(Math.min(elapsed, cfg.loopMs + 1));
    if (elapsed > cfg.loopMs) { done = true; noLoop(); tell('done'); }
  }
  return { setup, draw };
}

// ---- vocabulary ------------------------------------------------------------
function softBlobDraw(x, y, rx, ry, color, opacity, bleed, texture, rot = 0, jit = 0.12) {
  const w = S.water - 0.5;
  fillStyle(color, Math.round(opacity - w * 60), clamp01(bleed + w * 0.4), clamp01(texture + w * 0.2), 0.3);
  brush.polygon(jitterEllipse(x, y, rx, ry, 14, jit, rot));
}
function centerDot(x, y, r, color, opacity = 250) { washStyle(color, opacity); brush.polygon(jitterEllipse(x, y, r, r * rr(0.85, 1), 12, 0.14)); }
function glazeDraw(x0, y0, x1, y1, color, weight, field = 'hand') { brush.field(field); strokeStyle('marker', color, weight * S.brushSize); brush.line(x0, y0, x1, y1); brush.noField(); }
function flickDraw(x, y, len, a, color, weight) { strokeStyle('flick', color, weight * S.brushSize); brush.line(x - Math.cos(a) * len / 2, y - Math.sin(a) * len / 2, x + Math.cos(a) * len / 2, y + Math.sin(a) * len / 2); }

function dWash(color, opacity) {
  const pts = [[-10, -SHIFT - 10], [W + 10, -SHIFT - 10], [W + 10, H + 10], [-10, H + 10]];
  return D(() => { washStyle(color, opacity); brush.polygon(pts); }, [0, -SHIFT, W, H], 'x', 1, 700, 120);
}
function dBand(y0, y1, color, opacity, wobble) {
  const pts = bandPolygon(y0, y1, wobble), bleed = 0.25 + S.water * 0.5, texture = 0.3 + S.water * 0.5;
  return D(() => { fillStyle(color, opacity, bleed, texture, 0.3); brush.polygon(pts); }, bboxOf(pts, m * 0.25), 'x', rdir(), 600, 100);
}
function dSea(y0, y1, color, opacity) {
  const pts = bandPolygon(y0, y1, m * 0.003, 30);
  return D(() => { fillStyle(color, opacity, 0.04, 0.3, 0.2); brush.polygon(pts); }, [0, Math.max(0, Math.floor(y0 - 20)), W, Math.min(H, Math.ceil(y1 + 20))], 'x', 1, 600, 100);
}
function dBlob(x, y, rx, ry, color, opacity, bleed, texture, rot = 0, jit = 0.12, dur = 420) {
  const big = Math.max(rx, ry), pad = big * 0.9 + 14;
  const bb = [Math.max(0, x - big - pad), Math.max(0, y - big - pad), Math.min(W, x + big + pad), Math.min(H, y + big + pad)];
  return D(() => softBlobDraw(x, y, rx, ry, color, opacity, bleed, texture, rot, jit), bb.map(Math.round), raxis(), rdir(), dur, 80);
}
function dShape(pts, color, opacity, bleed, texture, axis = 'x', dir = 1, dur = 520) {
  return D(() => { fillStyle(color, opacity, bleed, texture, 0.35); brush.polygon(pts); }, bboxOf(pts, 24), axis, dir, dur, 80);
}
function dGlaze(x0, y0, x1, y1, color, weight, field) {
  const bb = bboxOf([[x0, y0], [x1, y1]], 14 + weight * 4 * S.brushSize);
  const axis = Math.abs(x1 - x0) >= Math.abs(y1 - y0) ? 'x' : 'y';
  const dir = axis === 'x' ? Math.sign(x1 - x0) || 1 : Math.sign(y1 - y0) || 1;
  return D(() => glazeDraw(x0, y0, x1, y1, color, weight, field), bb, axis, dir, 160 + Math.hypot(x1 - x0, y1 - y0) * 1.2, 40);
}
function dMarks(marks, dur = 220, gap = 40) {
  const items = [];
  for (let i = 0; i < marks.length; i += 10) {
    const b = marks.slice(i, i + 10);
    let pts = [];
    for (const d of b) pts = pts.concat(d.pts);
    items.push(D(() => { for (const d of b) { washStyle(d.color, d.op); brush.polygon(d.pts); } }, bboxOf(pts, 10), raxis(), rdir(), dur, gap));
  }
  return items;
}
function dFlick(x, y, len, a, color, weight) {
  const bb = bboxOf([[x - Math.cos(a) * len / 2, y - Math.sin(a) * len / 2], [x + Math.cos(a) * len / 2, y + Math.sin(a) * len / 2]], 10 + weight * 5);
  return D(() => flickDraw(x, y, len, a, color, weight), bb, 'x', rdir(), 90, 25);
}

// ---- the scene -----------------------------------------------------------------
let wordmark = null;

function makeWordmark() {
  const g = createGraphics(W, H);
  g.pixelDensity(Math.min(2, window.devicePixelRatio || 1));
  const ctx = g.drawingContext, size = H * 0.34;
  ctx.font = `600 ${size}px "PaperSeek Geist", "Segoe UI", Arial, sans-serif`;
  if ('letterSpacing' in ctx) ctx.letterSpacing = `${-size * 0.04}px`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'top';
  const top = H * 0.07, grad = ctx.createLinearGradient(0, top, 0, top + size * 1.05);
  grad.addColorStop(0.05, 'rgba(255,255,255,0.92)');
  grad.addColorStop(0.55, 'rgba(255,255,255,0.4)');
  grad.addColorStop(1, 'rgba(255,255,255,0.05)');
  ctx.fillStyle = grad;
  ctx.fillText('PaperSeek', W / 2, top);
  return { g, bb: [Math.round(W * 0.08), Math.round(top - 6), Math.round(W * 0.92), Math.round(top + size * 1.1)] };
}

function buildLighthouse(C) {
  const out = [], horizon = H * 0.6;

  // dusk sky, a warm band at the horizon, the sea in two depths, the low sun's glow
  out.push(dWash(C.sky[1], Math.round(S.coverage * 220)));
  out.push(dBand(-SHIFT - 20, horizon * 0.42, C.sky[0], 220, m * 0.03));
  out.push(dBand(horizon * 0.5, horizon * 0.9, C.sky[2], 190, m * 0.03));
  out.push(dBand(horizon * 0.8, horizon + H * 0.01, C.glow, 210, m * 0.015));
  out.push(dSea(horizon, H * 0.84, C.sea[0], 235));
  out.push(dBand(H * 0.8, H + 20, C.sea[1], 180, m * 0.01));
  out.push(dBlob(W * 0.66, horizon - H * 0.01, W * 0.08, H * 0.05, mixHex(C.glow, C.highlights[0], 0.5), 160, 0.5, 0.5, 0, 0.15, 420));

  // clouds catching the last light, and a distant island on the horizon
  for (const c of [{ x: W * 0.36, y: H * 0.2, rx: W * 0.11, ry: H * 0.06 }, { x: W * 0.78, y: H * 0.12, rx: W * 0.09, ry: H * 0.05 }, { x: W * 0.55, y: H * 0.42, rx: W * 0.16, ry: H * 0.025 }]) {
    out.push(dBlob(c.x, c.y + c.ry * 0.3, c.rx, c.ry * 0.7, mixHex(C.sea[0], C.foliage[3], 0.4), 140, 0.6, 0.5, 0, 0.2, 360));
    out.push(dBlob(c.x, c.y, c.rx * 0.9, c.ry, pickOne(C.accents), 190, 0.55, 0.5, rr(-0.08, 0.08), 0.3, 400));
  }
  const island = [[W * 0.36, horizon + 2]];
  for (let i = 0; i <= 10; i++) { const t = i / 10; island.push([W * (0.37 + 0.2 * t), horizon - H * 0.05 * Math.sin(Math.PI * t) * (0.8 + 0.2 * Math.sin(t * 9)) ]); }
  island.push([W * 0.58, horizon + 2]);
  out.push(dShape(island, mixHex(C.foliage[3], C.sky[2], 0.35), 210, 0.3, 0.4));

  // stars, and a few joined into constellations: the citations among papers
  const stars = [];
  for (let i = 0; i < 60; i++) {
    const x = rr(W * 0.25, W), y = rr(-SHIFT, horizon * 0.55), r = rr(0.8, 2) * (m / 420);
    stars.push({ color: random() < 0.8 ? C.highlights[1] : C.teal, pts: jitterEllipse(x, y, r, r, 6, 0.1), op: Math.round(rr(150, 240)) });
  }
  out.push(...dMarks(stars, 160, 20));
  const clusters = [[W * 0.43, H * 0.1], [W * 0.66, H * 0.05], [W * 0.9, H * 0.16]];
  for (const [cx, cy] of clusters) {
    const pts = []; for (let i = 0; i < 5; i++) pts.push([cx + rr(-W * 0.05, W * 0.05), cy + rr(-H * 0.05, H * 0.05)]);
    pts.sort((a, b) => a[0] - b[0]);
    for (let i = 1; i < pts.length; i++) out.push(dGlaze(pts[i - 1][0], pts[i - 1][1], pts[i][0], pts[i][1], C.teal, 0.9, 'hand'));
    out.push(D(() => { for (const [x, y] of pts) centerDot(x, y, 2.6 * (m / 420), C.highlights[1], 250); }, bboxOf(pts, 12), 'x', 1, 160, 30));
  }

  // the name, written in light across the sky; the shore is painted over it
  out.push(D((g) => { g.image(wordmark.g, 0, 0, W, H); }, wordmark.bb, 'x', 1, 1100, 160));

  // the lighthouse beam sweeping the sky (the shore and tower are painted over its root)
  const beamFrom = [W * 0.204, H * 0.155];
  const beam = [beamFrom, [W * 0.92, -H * 0.04], [W * 0.95, H * 0.14]];
  out.push(D(() => { fillStyle(C.lamp, 95, 0.12, 0.1, 0.2); brush.polygon(beam); }, bboxOf(beam, 30), 'x', 1, 700, 120));

  // stratified cliffs on the right, layered like the edges of stacked pages
  const cliffTop = (x) => H * (0.3 + 0.05 * Math.sin(x / W * 9) + 0.18 * Math.max(0, (0.66 - x / W) / 0.06) ** 1.4);
  const cliff = [[W * 0.62, horizon + 3]];
  for (let x = W * 0.62; x <= W + 10; x += W * 0.02) cliff.push([x, Math.min(horizon, cliffTop(x))]);
  cliff.push([W + 10, horizon + 3]);
  out.push(dShape(cliff, C.cliff[2], 255, 0.06, 0.25, 'y', 1, 500));
  out.push(dShape(cliff, C.cliff[0], 235, 0.06, 0.35, 'y', 1, 500));
  const strata = [];
  for (let i = 0; i < 90; i++) {
    const x = rr(W * 0.68, W * 0.98), top = cliffTop(x) + H * 0.03, y = rr(top, horizon - 4);
    strata.push({ color: pickOne(C.cliff), pts: jitterEllipse(x, y, W * rr(0.015, 0.035), H * rr(0.003, 0.006), 8, 0.12, rr(-0.02, 0.02)), op: Math.round(rr(110, 180)) });
  }
  out.push(...dMarks(strata, 200, 30));
  for (let i = 0; i < 6; i++) { const x0 = W * (0.63 + i * 0.06); out.push(dGlaze(x0, cliffTop(x0) + 3, x0 + W * 0.06, cliffTop(x0 + W * 0.06) + 3, C.grass, 2.2, 'hand')); }
  const stack = [[W * 0.585, horizon + 2], [W * 0.588, H * 0.42], [W * 0.6, H * 0.4], [W * 0.612, H * 0.43], [W * 0.61, horizon + 2]];
  out.push(dShape(stack, C.cliff[2], 230, 0.15, 0.45, 'y', 1, 300));

  // the headland and its lighthouse, then the beam reaching across the sky
  const head = [[-10, horizon + H * 0.03], [-10, H * 0.44]];
  for (let i = 0; i <= 12; i++) { const t = i / 12, x = W * 0.34 * t; head.push([x, H * (0.46 - 0.06 * Math.exp(-(((t - 0.6) / 0.22) ** 2)) + 0.2 * Math.max(0, t - 0.74) ** 1.5 * 6)]); }
  head.push([W * 0.355, horizon + 2], [W * 0.2, horizon + H * 0.03]);
  out.push(D(() => { washStyle(C.foliage[2], 250); brush.polygon(head); fillStyle(C.foliage[0], 110, 0.04, 0.55, 0.35); brush.polygon(head); }, bboxOf(head, 24), 'x', 1, 640, 80));
  const lx = W * 0.204, base = H * 0.43, top = H * 0.17, half = (y) => W * (0.011 + 0.006 * (y - top) / (base - top));
  const tower = [[lx - half(base), base], [lx + half(base), base], [lx + half(top), top], [lx - half(top), top]];
  const bands = [0.25, 0.55, 0.85].map((f) => { const y0 = top + (base - top) * (f - 0.1), y1 = top + (base - top) * (f + 0.03); return [[lx - half(y0) - 1, y0], [lx + half(y0) + 1, y0], [lx + half(y1) + 1, y1], [lx - half(y1) - 1, y1]]; });
  const cap = [[lx - W * 0.014, top], [lx + W * 0.014, top], [lx, top - H * 0.07]];
  out.push(D(() => {
    washStyle(C.highlights[1], 250); brush.polygon(tower);
    for (const b of bands) { washStyle(C.stripe, 240); brush.polygon(b); }
    washStyle(C.foliage[2], 245); brush.polygon(cap);
  }, bboxOf([...tower, ...cap], 16), 'y', -1, 520, 80));
  out.push(D(() => { centerDot(lx, top - H * 0.012, W * 0.007, C.lamp, 250); }, bboxOf([[lx, top - H * 0.03], [lx, top]], 20), 'y', -1, 160, 40));
  out.push(dBlob(lx, top - H * 0.012, W * 0.035, W * 0.035, C.lamp, 160, 0.9, 0.3, 0, 0.2, 200));

  // ripples and glints on the water, and the beam's long reflection
  const dashes = [];
  for (let i = 0; i < 260; i++) {
    const y = horizon + (H - horizon) * Math.pow(random(), 0.7), near = (y - horizon) / (H - horizon), x = rr(-5, W + 5);
    const len = m * rr(0.012, 0.04) * (0.5 + near) * S.brushSize, h = m * rr(0.002, 0.0035) * (0.6 + near) * S.brushSize;
    const lit = Math.abs(x - W * 0.66) < W * (0.05 + 0.1 * near) && random() < 0.6;
    const color = lit ? pickOne(C.highlights) : (random() < 0.6 ? C.sea[2] : mixHex(C.sea[0], C.highlights[0], 0.3));
    dashes.push({ color, pts: jitterEllipse(x, y, len, h, 8, 0.2, rr(-0.06, 0.06)), op: Math.round(rr(120, 200)) });
  }
  out.push(...dMarks(dashes));
  for (let i = 0; i < 6; i++) { const y = rr(horizon + H * 0.04, H), x0 = rr(W * 0.38, W * 0.6); out.push(dGlaze(x0, y, x0 + rr(W * 0.06, W * 0.14), y, random() < 0.5 ? C.highlights[0] : C.glow, rr(0.8, 1.4), 'hand')); }
  for (let i = 0; i < 12; i++) out.push(dFlick(W * 0.66 + randomGaussian(0, W * 0.04), rr(horizon + 4, H * 0.95), rr(10, 24), rr(-0.05, 0.05), pickOne(C.highlights), rr(0.6, 1)));
  return out;
}

const CONFIG = { loopMs: 9000, palette: PALETTE, strokes: buildLighthouse };
let engine = null;

async function setup() {
  try {
    const font = new FontFace('PaperSeek Geist', `url(${query.get('font')})`, { weight: '100 900' });
    document.fonts.add(await font.load());
  } catch { /* the wordmark falls back to a system face */ }
  engine = createEngine(CONFIG);
  engine.setup();
  wordmark = makeWordmark();
}
function draw() { if (engine && wordmark) engine.draw(); }

(async () => {
  await loadScript(query.get('p5'));
  await loadScript(query.get('brush'));
  // Global-mode p5 starts itself once the window has loaded.
  if (document.readyState === 'complete') new p5();
})().catch(() => tell('failed'));
</script>
