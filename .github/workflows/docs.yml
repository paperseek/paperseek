name: Docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "*.md"
      - ".markdownlint-cli2.jsonc"
      - "scripts/check-docs.mjs"
      - "backend/pyproject.toml"
      - "package.json"
      - "package-lock.json"
      - "web/package*.json"
      - "web/playwright*.ts"
      - "web/tests/docs/**"
      - ".github/workflows/docs.yml"
  pull_request:
    branches: [main]
    paths:
      - "docs/**"
      - "*.md"
      - ".markdownlint-cli2.jsonc"
      - "scripts/check-docs.mjs"
      - "backend/pyproject.toml"
      - "package.json"
      - "package-lock.json"
      - "web/package*.json"
      - "web/playwright*.ts"
      - "web/tests/docs/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build VitePress site
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.14.0"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check docs
        run: npm run docs:check && npm run docs:lint

      - name: Build docs
        run: npm run docs:build
        env:
          DOCS_BASE: /

      - name: Check documentation scrolling
        working-directory: web
        run: |
          npm ci
          npx playwright install --with-deps chromium || npx playwright install chromium
          npx playwright test --config playwright.docs.config.ts scrolling.spec.ts

      - name: Publish to gh-pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd docs/.vitepress/dist
          git init
          git checkout -b gh-pages
          git add -A
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "Deploy docs"
          git push --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
