[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "paperseek"
version = "1.0.0b5"
description = "PaperSeek Community backend"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
authors = [
    { name = "PaperSeek Development Team", email = "support@paperseek.app" },
]
maintainers = [
    { name = "PaperSeek Development Team", email = "support@paperseek.app" },
]
keywords = ["literature-search", "openalex", "crossref", "web-of-science", "llm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Framework :: FastAPI",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "alembic==1.19.1",
    "cryptography==49.0.0",
    "fastapi==0.141.1",
    "httpx==0.28.1",
    "pydantic==2.13.4",
    "python-docx==1.2.0",
    "sqlalchemy==2.0.51",
    "uvicorn==0.52.1",
]

[project.urls]
Homepage = "https://paperseek.app/"
Repository = "https://github.com/paperseek/paperseek"
Issues = "https://github.com/paperseek/paperseek/issues"
Documentation = "https://docs.paperseek.app/"
Online-Demo = "https://paperseek.app/"

[project.scripts]
paperseek = "paperseek_community.cli:main"

[dependency-groups]
dev = [
    "mypy==2.3.1",
    "ruff==0.15.17",
]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B020", "B904", "B905"]

[tool.mypy]
python_version = "3.12"
files = [
    "src/paperseek_core/key_pool.py",
    "src/paperseek_core/http_retry.py",
    "src/paperseek_core/model_http.py",
    "src/paperseek_core/ranking_output.py",
    "src/paperseek_community/credential_resolution.py",
    "src/paperseek_app/settings.py",
    "src/paperseek_app/settings_probes.py",
]
follow_imports = "silent"
check_untyped_defs = true
disallow_untyped_defs = true

[tool.setuptools.packages.find]
where = ["src"]
include = ["paperseek_core*", "paperseek_app*", "paperseek_community*"]

[tool.setuptools.package-data]
paperseek_community = ["static/**/*", "web_source.zip"]
