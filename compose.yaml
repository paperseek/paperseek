name: paperseek

services:
  paperseek:
    image: ghcr.io/paperseek/paperseek:${PAPERSEEK_VERSION:-1.0.0-beta5}
    command: ["serve", "--database", "/var/lib/paperseek/paperseek.db", "--host", "0.0.0.0", "--port", "8765"]
    ports:
      - "${PAPERSEEK_HOST:-127.0.0.1}:${PAPERSEEK_PORT:-8765}:8765"
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    volumes:
      - paperseek-data:/var/lib/paperseek

volumes:
  paperseek-data:
