[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "paperseek-mcp"
version = "1.0.0b3"
description = "Model Context Protocol integration for PaperSeek"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
authors = [
    { name = "PaperSeek Development Team", email = "support@paperseek.app" },
]
maintainers = [
    { name = "PaperSeek Development Team", email = "support@paperseek.app" },
]
keywords = ["literature-search", "mcp", "openalex", "crossref", "llm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "mcp==2.0.0",
    "paperseek==1.0.0b3",
]

[project.urls]
Homepage = "https://paperseek.app/"
Repository = "https://github.com/paperseek/paperseek"
Issues = "https://github.com/paperseek/paperseek/issues"
Documentation = "https://docs.paperseek.app/"
Online-Demo = "https://paperseek.app/"

[project.scripts]
paperseek-mcp = "paperseek_mcp.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["paperseek_mcp*"]

[tool.setuptools.data-files]
"share/paperseek-mcp" = ["server.json"]

[tool.uv.sources]
paperseek = { path = "../../backend" }
